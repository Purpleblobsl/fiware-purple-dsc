{{- with .Values.cmPatch }}{{- if and .enabled .registrySecret.auths }}

{{- $auths := dict }}
{{- range $auth := .registrySecret.auths }}
  {{- $_ := set $auths $auth.registry (dict "auth" (printf "%s:%s" $auth.username $auth.password | b64enc)) }}
{{- end }}
{{- $dockerconfig := dict "auths" $auths | toJson | b64enc -}}

apiVersion: v1
kind: Secret
type: kubernetes.io/dockerconfigjson
metadata:
  name: {{ .registrySecret.name }}
  namespace: {{ $.Release.Namespace }}
data:
  .dockerconfigjson: {{ $dockerconfig }}

{{- end }}{{- end }}
