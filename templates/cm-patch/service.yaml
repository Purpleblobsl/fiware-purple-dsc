{{- with .Values.cmPatch }}{{- if and .enabled .registrySecret.auths }}

apiVersion: v1
kind: Service
metadata:
  name: cm-patch
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "purple-dsc.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "purple-dsc.selectorLabels" $ | nindent 4 }}
    app: cm-patch

{{- end }}{{- end }}
