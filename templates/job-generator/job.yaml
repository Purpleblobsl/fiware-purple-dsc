{{- if .Values.jobs.enabled }}

{{- if .Values.jobs.serviceAccount.create }}
{{- with .Values.jobs.serviceAccount }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "purple-dsc.jobServiceAccountName" $ }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "purple-dsc.labels" $ | nindent 4 }}
{{- end }}
{{- end }}

{{- range $name, $job := .Values.jobs.definitions }}
{{- if $job.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "purple-dsc.labels" $ | nindent 4 }}
spec:
  backoffLimit: {{ $job.backoffLimit | default 3 }}
  ttlSecondsAfterFinished: {{ $job.ttlSecondsAfterFinished | default 600 }}
  template:
    metadata:
      labels:
        {{- include "purple-dsc.selectorLabels" $ | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "purple-dsc.jobServiceAccountName" $ }}
      containers:
        - name: {{ $name }}
          image: {{ $job.image }}
          imagePullPolicy: {{ $job.pullPolicy | default "IfNotPresent" }}
          command:
            {{- toYaml $job.command | nindent 12 }}
          args:
            {{- toYaml $job.args | nindent 12 }}
          {{- with $job.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}

{{- with $job.rbac }}
{{- if .create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "purple-dsc.labels" $ | nindent 4 }}
rules:
  {{- toYaml .rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-{{ .name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "purple-dsc.labels" $ | nindent 4 }}
subjects:
  # NOTE: This is to always set the namespace automatically on all subjects
  # we copy the original object, set the namespace, then use theh copy later
  {{- $subjects := list }}
  {{- range $_, $subject := .subjects }}
    {{- $s := deepCopy $subject }}
    {{- $_ := set $s "namespace" $.Release.Namespace }}
    {{- $subjects = append $subjects $s }}
  {{- end }}
  {{- toYaml $subjects | nindent 2 }}
roleRef:
  kind: Role
  name: {{ .name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}

{{- end }}
{{- end }}
{{- end }}