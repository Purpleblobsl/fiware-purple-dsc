{{- if .Values.did.enabled }}
{{- with .Values.did.genKeystorePassword }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace .name }}
{{- $password := "" }}
{{- if $existing }}
  {{- $password = index $existing.data .key }}
{{- else }}
  {{- $password = randAlphaNum 30 | b64enc }}
{{- end }}
{{- if .enabled }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "purple-dsc.labels" $ | nindent 4 }}
data:
  {{ .key }}: {{ $password | quote }}
{{- end }}
{{- end }}
{{- end }}
