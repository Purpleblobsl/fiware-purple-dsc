# = Note ===================================================================== #
# The `did-helper` the provided by the connector is somewhat fragile, so some  #
# cooking needed to be done.                                                   #
#                                                                              #
# Instead of deploying a `did-helper` that generates ephimeral cryptographic   #
# material on startup (loosing the previous DID...), we run a Job that         #
# generate a Secret with all the required artifacts. Those are mounted into a  #
# minimal static website container.                                            #
#                                                                              #
# This approach makes the DID and its associated cryptographic material        #
# available to other workloads whenever needed. Plus a Pod restart doesn't     #
# break the DSC deployment.                                                    #
#                                                                              #
# This implementation currently supports only `did:key` identifiers. If we     #
# migrate to `did:web` in the future, most (or all) of this machinery will     #
# likely become unnecessary and can be removed.                                #
#                                                            sign: The Janitor #
# ============================================================================ #
did:
  # based on: https://github.com/FIWARE/helm-charts/tree/main/charts/did-helper
  # changes: always generate key unless, "did.secretName" exists
  enabled: true
  job:
    repository: quay.io/seamware/did-helper
    pullPolicy: IfNotPresent
    tag: "0.5.0"

    annotations: *hookAnnotations

  imagePullSecrets: []

  secretName: *didSecret

  genKeystorePassword:
    enabled: true
    name: &ksSecret    "keystore-password"
    key:  &ksSecretKey "password"

  server:
    image: lipanski/docker-static-website
    pullPolicy: IfNotPresent
    tag: "2.1.0"
    port: 3000

  config:
    server:
      # Name of the secret containing the keystore password.
      # If generateKey is used, this optional, but if provided it needs to be set with the secret name containing the password to be used for the created keystore
      keystorePasswordSecretName: *ksSecret
      # Key inside the secret containing the keystore password
      # If generateKey is used, this optional, but if provided it needs to be set with the secret key containing the password to be used for the created keystore
      keystorePasswordSecretKey: *ksSecretKey
      # Alias for the key inside the keystore
      # If generateKey is used, this is optional, but if provided, generated keystore will use this alias for the created key
      keyAlias: "didPrivateKey"
    generateKey: *didCreds

  replicaCount: 1

# = BUG PATCH ================================================================ #
# Generate a ConfigMap and import the variables from it to avoid defining      #
# duplicate `BAE_LP_SIOP_*` environment variables that would otherwise         #
# override each other.                                                         #
#                                                                              #
# The configuration is sourced directly from `.dsc.marketplace`.               #
# ============================================================================ #
bae:
  enabled: true

# = BUG PATCH ================================================================ #
# This section fully overrides Helm's deep-merged defaults to prevent          #
# inherited keys from parent charts leaking into `users` and `databases` maps. #
#                                                                              #
# It pathches `dsc.decentralizedIam.vcAuthentication.managedPostgres` and      #
# produces a leak clean resource.                                              #
# ============================================================================ #
## Usage of the postgres-operator - see https://github.com/zalando/postgres-operator
managedPostgres:
  enabled: true

  # Note: the config was taken from this cool fella:
  #       > https://github.com/FIWARE/data-space-connector/pull/73
  # -- config as defined in https://github.com/zalando/postgres-operator/blob/master/charts/postgres-operator/crds/postgresqls.yaml
  config:
    teamId: "dsc"
    numberOfInstances: 1
    postgresql:
      version: "16"
    volume:
      size: 1Gi
      storageClass: *storageClass
    users:
      admin: # maintainer
        - superuser
        - createdb
      til:
        - createdb
      ccs:
        - createdb
      pap:
        - createdb
      keycloak:
        - createdb
      scorpio:
        - superuser #  to enable extensions
        - createdb
      # ih:           # Note: we dont use the identityhub
      #   - createdb
      # issuer:       # Note: I don't think we need this...
      #   - createdb
    databases:
      ngb: scorpio
      tildb: til
      ccsdb: ccs
      papdb: pap
      keycloakdb: keycloak
      # ih: ih
      # issuer: issuer
    patroni:
      pg_hba: # Allow connections without ssl as db is not exposed
        - local   all all           trust
        - hostssl all all 0.0.0.0/0 md5
        - host    all all 0.0.0.0/0 md5
    preparedDatabases:
      ngb:
        defaultUsers: true
        extensions:
          postgis: public

