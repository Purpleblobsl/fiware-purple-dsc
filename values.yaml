  #       lastName: "Admin"
  #       credentials:
  #         - type: "password"
  #           value: "admin"
  #       clientRoles:
  #         ${DID}: [ "admin" ]
  #         account: [ "view-profile", "manage-account" ]
  #       groups: []
  #     - username: "employee"
  #       enabled: true
  #       email: "employee@example.com"
  #       firstName: "Test"
  #       lastName: "User"
  #       credentials:
  #         - type: "password"
  #           value: "employee"
  #       clientRoles:
  #         ${DID}: [ "seller", "admin", "REPRESENTATIVE" ]
  #         account: [ "view-profile", "manage-account" ]
  #       groups: [ "/consumer" ]
      - username: &kcDeviceUser "device"
        enabled: true
        email: "<<device-email>>"
        firstName: "changemeFirstName"
        lastName: "changemeLastName"
        credentials:
          - type: "password"
            value: &kcDevicePassword "<<device-password>>"
        clientRoles:
          ${DID}: [ "admin", "seller", "REPRESENTATIVE", "OPERATOR", "READER" ]
