  # Note: config taken from:
  #       > https://github.com/FIWARE/data-space-connector/blob/main/k3s/provider.yaml
  ## Usage of the mongo-operator - see https://github.com/mongodb/mongodb-kubernetes-operator
  managedMongo:
    enabled: true
    spec:
      # additionalMongodConfig:
      #   storage.wiredTiger.engineConfig.journalCompressor: zlib
      statefulSet:
        spec:
          template:
            spec:
              # Note: Hostpath volumes are owned by root but MongoDB containers
              #       run as non root so we use an init container to change the
              #       owner of the directory (init containers run as root)
              initContainers:
                - name: change-dir-permissions
                  image: busybox
                  command: ["chown", "-R", "2000", "/data"]
                  volumeMounts:
                    - mountPath: /data
                      name: data-volume
                  securityContext:
                    runAsNonRoot: false
                    runAsUser: 0
                    runAsGroup: 0
                - name: mongodb-agent-readinessprobe
                  resources: &mongoResources
                    limits:
                      cpu: "0.2"
                      memory: 200M
                    requests:
                      cpu: "0.1"
                      memory: 100M
              containers:
                - name: mongod
                  resources: *mongoResources
                - name: mongodb-agent
                  resources: *mongoResources
          volumeClaimTemplates:
            - metadata:
                name: data-volume
              spec: &mongoVolumeSpec
                accessModes:
                  - ReadWriteOnce
                storageClassName: *storageClass
                resources:
                  requests:
                    storage: "1Gi"
            - metadata:
                name: logs-volume
              spec: *mongoVolumeSpec

  # -- configuration for the marketplace components (https://github.com/FIWARE/helm-charts/tree/main/charts/business-api-ecosystem)
  marketplace:
    enabled: true
    fullnameOverride: "marketplace"

    externalUrl: *mpUrl

    # -- should random passwords for the database connection of marketplace components be generated in the cluster.
    # When `true` (and on `helm install` only) the chart creates `mongodb-admin-password`, `mongodb-charging-password`
    # and `mongodb-belp-password` Secrets with random values. The Secrets are annotated with
    # `helm.sh/resource-policy: keep` so they survive `helm upgrade` and `helm uninstall` and the passwords are
    # never rotated by Helm. This is convenient for local/demo deployments but NOT recommended for production:
    # since the Secrets are annotated as kept, Helm will not adopt or update them, and re-installs may collide
    # with stale Secrets. For production, set this to `false` and provide the three Secrets externally
    # (e.g. via External Secrets Operator, Sealed Secrets, SOPS, or an out-of-band `kubectl apply`).
    generatePasswords: true

    # = Note ================================================================= #
    # This component allegedly does the same thing as `tm-forum-api`, so we    #
    # don't really need it.                                                    #
    # = Bug ================================================================== #
    # This component expects a `mysql` DB to be deployed, but for some reason  #
    # the umbrella chart doesn't do that, so we would need to patch it if we   #
    # wanted to use it.  (._.')                                                #
    # ======================================================================== #
    # -- should the tmforum deployed together with the marketplace?
    bizEcosystemApis:
      enabled: false

      # = Note =============================================================== #
      # DON'T DELETE THIS. Even thought this component is disabled, the        #
      # `bizEcosystem` components will use this definitions to target the      #
      # deployed `tm-forum-api`.                                               #
      # = Bug ================================================================ #
      # The init containers of the `bizEcosystem` will use the `fullname` +    #
      # `service.port`, So this needs to match the `tm-forum-api`              #
      # configuration... q(-_- )                                               #
      # ====================================================================== #
      fullnameOverride: &tmfService tm-forum-api-svc
      service:
        port: &tmfPort 8080

      tmForum:
        catalog:
          host: *tmfService
          port: *tmfPort
          path: /tmf-api/productCatalogManagement/v4
        inventory:
          host: *tmfService
          port: *tmfPort
          path: /tmf-api/productInventory/v4
        ordering:
          host: *tmfService
          port: *tmfPort
          path: /tmf-api/productOrderingManagement/v4
        billing:
          host: *tmfService
          port: *tmfPort
          path: /tmf-api/accountManagement/v4
        usage:
          host: *tmfService
          port: *tmfPort
          path: /tmf-api/usageManagement/v4
        party:
          host: *tmfService
          port: *tmfPort
          path: /tmf-api/party/v4
        customer:
          host: *tmfService
          port: *tmfPort
          path: /tmf-api/customerManagement/v4
        resources:
          host: *tmfService
          port: *tmfPort
          path: /tmf-api/resourceCatalog/v4
        services:
          host: *tmfService
          port: *tmfPort
          path: /tmf-api/serviceCatalogManagement/v4
        resourceInventory:
          host: *tmfService
          port: *tmfPort
          path: /tmf-api/resourceInventoryManagement/v4

    # -- should RSS be enabled?
    bizEcosystemRss:
      enabled: false # Note: not neeeded

    # -- should vc based auth enabled?
    siop:
      # Note: we set this false, and mount the envs from a generated cm :)
      enabled: false
      # Note: this will throw a warn, but we need to override with DID:
      #         hides previous definition of "BAE_LP_SIOP_CLIENT_ID"
      clientId: ""
      # -- should the market place automatically registered in the credentials config service?
      ccs:
        enabled: false
      # -- paths to the verifier
      verifier:
        host: *verifierUrl
        qrCodePath: /api/v2/loginQR
        tokenPath: /token
        jwksPath: /.well-known/jwks
      # -- roles allowed by the market
      allowedRoles:
        - seller
        - customer
        - admin
        - REPRESENTATIVE
        - READER
        - OPERATOR

    # -- configuration for the charging backend
    bizEcosystemChargingBackend:
      enabled: true
      fullnameOverride: "biz-ecosystem-charging-backend"

      extraEnvVars:
        - name: BAE_CB_CUSTOMER_BILL
          value: "http://tm-forum-api-svc:8080/tmf-api/customerBillManagement/v4"

      existingSecret: mongodb-charging-password

      # -- max size to be used for the market
      maxUploadSize: "5242880"

      serviceAccount:
        create: false

      # -- configuration of the charging backend to be deployed
      deployment:
        image:
          tag: 11.3.1

      # -- should plugin support be enabled
      plugins:
        enabled: false

      media:
        enabled: true
        size: 8Gi

      port: 8006

      # loglevel: info
      loglevel: debug

      payment:
        method: None

      backup:
        enabled: false

      initContainers: false # Note: Tried my best to make them work sorry...
      propagateToken: true
      basePath: /opt/business-ecosystem-charging-backend
      token:
        enabled: false

      db:
        host: mongodb-svc
        database: charging_db
        user: charging
        secretKey: password

    # oauth: # TODO???
    #   provider: "vc"

    # -- configuration for the logic proxy
    bizEcosystemLogicProxy:
      enabled: true
      fullnameOverride: "biz-ecosystem-logic-proxy"

      statefulset:
        image:
          tag: 11.11.1

      serviceAccount:
        create: true

      ingress:
        enabled: true
        className: *ingressClass
        annotations:
          <<: *ingressAnnotations
          cert-manager.io/common-name: *mpHost
        hosts:
          - host: *mpHost
            paths: ["/"]
        tls:
          - secretName: marketplace-tls
            hosts:
              - *mpHost

      additionalEnvVars:
        - name: BAE_LP_SIOP_IS_REDIRECTION
          value: "true"
        - name: BAE_LP_PURCHASE_ENABLED
          value: "true"
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        # Note: fun block of manually mounted envs incoming
        - name: BAE_LP_SIOP_ENABLED
          valueFrom:
            configMapKeyRef:
              name: bae-cm
              key: BAE_LP_SIOP_ENABLED
        # - name: BAE_LP_SIOP_CLIENT_ID
        #   valueFrom:
        #     configMapKeyRef:
        #       name: bae-cm
        #       key: BAE_LP_SIOP_CLIENT_ID
        - name: BAE_LP_SIOP_VERIFIER_HOST
          valueFrom:
            configMapKeyRef:
              name: bae-cm
              key: BAE_LP_SIOP_VERIFIER_HOST
        - name: BAE_LP_SIOP_VERIFIER_QRCODE_PATH
          valueFrom:
            configMapKeyRef:
              name: bae-cm
              key: BAE_LP_SIOP_VERIFIER_QRCODE_PATH
        - name: BAE_LP_SIOP_VERIFIER_TOKEN_PATH
          valueFrom:
            configMapKeyRef:
              name: bae-cm
              key: BAE_LP_SIOP_VERIFIER_TOKEN_PATH
        - name: BAE_LP_SIOP_VERIFIER_JWKS_PATH
          valueFrom:
            configMapKeyRef:
              name: bae-cm
              key: BAE_LP_SIOP_VERIFIER_JWKS_PATH
        - name: BAE_LP_SIOP_CALLBACK_PATH
          valueFrom:
            configMapKeyRef:
              name: bae-cm
              key: BAE_LP_SIOP_CALLBACK_PATH
        - name: BAE_LP_SIOP_ALLOWED_ROLES
          valueFrom:
            configMapKeyRef:
              name: bae-cm
              key: BAE_LP_SIOP_ALLOWED_ROLES
        - <<: *didEnv
          name: BAE_LP_SIOP_CLIENT_ID
        - name: BAE_LP_SIOP_PRIVATE_KEY_PEM
          value: /certs-did/private-key.pem
        - name: DATASPACE_ENABLED
          value: "true"
      extraVolumeMounts:
        - name: did-priv-key
          mountPath: /certs-did
      extraContainerVolumes:
        - name: did-priv-key
          secret:
            secretName: *didSecret

      existingSecret: mongodb-belp-password

      # -- image to be used for the statefulset
      statefulset:
        image:
          repository: fiware/biz-ecosystem-logic-proxy
          tag: "11.15.0"
          pullPolicy: IfNotPresent

      port: 8004
      nodeEnvironment: production

      # -- db config
      db:
        host: mongodb-svc
        database: belp_db
        user: belp
        secretKey: password

      basePath: /opt/business-ecosystem-logic-proxy

      externalIdp:
        enabled: true
      initContainers: false # Note: Tried my best to make them work sorry...
      propagateToken: true

  # -- Eclipse Dataspace Components extensions for FIWARE ecosystem integration (https://github.com/FIWARE/helm-charts/tree/main/charts/fdsc-edc)
  fdsc-edc:
    enabled: false

  # Note: generates a Token from Keycloak, for the love of the game ( []-[])b
  #       Helper script to retrieve credentials for applications.
  # -- helper script to retrieve credentials for applications
  credentials:
    enabled: false
    keycloak:
      address: http://keycloak:8080
      realm: *kcRealm
      clientId: account-console
      username: *kcDeviceUser
      scope: openid
      password: *kcDevicePassword
    configurations:
      - id: marketplace-credential
        format: jwt_vc
        targetFile: marketplace-credential.jwt
      - id: membership-credential
        format: jwt_vc
        targetFile: membership-credential.jwt
      - id: legal-person-credential
        format: jwt_vc
        targetFile: legal-person-credential.jwt

  # Note: bridge for "Eclipse EDC"
  identityhub:
    enabled: false

  # -- Secure, store, and tightly control access to sensitive data (https://github.com/hashicorp/vault-helm)
  vault:
    enabled: false

  # -- configuration for the cert-manager component (https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml)
  cert-manager:
    enabled: false

  # -- configuration for additional resources to be deployed for cert-manager, like ClusterIssuers
  certManagerResources:
    enabled: false

  # -- list of extra Kubernetes manifests to deploy alongside the chart.
  # Each entry can be a string (raw YAML, supports Helm templating) or an object.
  extraManifests: []

  # -- dashboard for operating the FIWARE Data Space Connector
  fdsc-dashboard:
    enabled: false
