  ## configuration of the tm-forum-api - see https://github.com/FIWARE/helm-charts/tree/main/charts/tm-forum-api for details
  tm-forum-api:
    enabled: true
    fullnameOverride: "tm-forum-api"

    # Note: the dsc overrides the tmf defaults, removing some components...
    apis:
      - name: party-catalog
        image: tmforum-party-catalog
        basePath: /tmf-api/party/v4

      - name: customer-bill-management
        image: tmforum-customer-bill-management
        basePath: /tmf-api/customerBillManagement/v4

      - name: customer-management
        image: tmforum-customer-management
        basePath: /tmf-api/customerManagement/v4

      - name: product-catalog
        image: tmforum-product-catalog
        basePath: /tmf-api/productCatalogManagement/v4

      - name: product-inventory
        image: tmforum-product-inventory
        basePath: /tmf-api/productInventory/v4

      - name: product-ordering-management
        image: tmforum-product-ordering-management
        basePath: /tmf-api/productOrderingManagement/v4

      - name: resource-catalog
        image: tmforum-resource-catalog
        basePath: /tmf-api/resourceCatalog/v4

      - name: resource-function-activation
        image: tmforum-resource-function-activation
        basePath: /tmf-api/resourceFunctionActivation/v4

      - name: resource-inventory
        image: tmforum-resource-inventory
        basePath: /tmf-api/resourceInventoryManagement/v4

      - name: service-catalog
        image: tmforum-service-catalog
        basePath: /tmf-api/serviceCatalogManagement/v4

      - name: service-inventory
        image: tmforum-service-inventory
        basePath: /tmf-api/serviceInventory/v4

      - name: account-management
        image: tmforum-account
        basePath: /tmf-api/accountManagement/v4

      - name: agreement-management
        image: tmforum-agreement
        basePath: /tmf-api/agreementManagement/v4

      - name: party-role
        image: tmforum-party-role
        basePath: /tmf-api/partyRoleManagement/v4

      - name: usage-management
        image: tmforum-usage-management
        basePath: /tmf-api/usageManagement/v4

      - name: quote
        image: tmforum-quote
        basePath: /tmf-api/quote/v4

      - name: resource-order-management
        image: tmforum-resource-order-management
        basePath: /tmf-api/resourceOrderingManagement/v4

      - name: service-ordering-management
        image: tmforum-service-order-management
        basePath: /tmf-api/serviceOrdering/v4

      - name: software-management
        image: tmforum-software-management
        basePath: /tmf-api/softwareCompute/v4

    # -- All TM Forum APIs in a single deployment, using the all-in-one image. This is recommended for testing and development, but not for production use. When set to false, every API will be deployed separately, allowing for more flexibility and scalability.
    allInOne:
      enabled: true

    # redis caching
    redis:
      enabled: false

    ingress:
      enabled: false
      className: *ingressClass
      annotations: *ingressAnnotations
      hosts:
        - host: *tmfHost
          paths: ["/"]
      tls:
        - secretName: tmforum-tls
          hosts:
            - *tmfHost

    ## configuration to be used by every api-deployment if nothing specific is provided.
    defaultConfig:
      # contextUrl: "https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context.jsonld"
      contextUrl: "https://raw.githubusercontent.com/SEAMWARE/fdsc-edc/refs/heads/main/schemas/odrl-context.jsonld"
      # -- configuration for proemtheus metrics
      prometheus:
        enabled: false
      # --  ngsi-ld broker connection information
      ngsiLd:
        url: *dssUrl
        # Note: the pod stopped crying with this (the default is 'ngsi-ld/v1')
        path: "/ngsi-ld/v1"

      serverHost: *tmfUrl # Note: this sets `GENERAL_SERVER_HOST`

      # logLevel: TRACE
      logLevel: INFO

      additionalEnvVars:
        - name: API_EXTENSION_ENABLED
          value: "true"
        - name: GENERAL_NGSILDORQUERYVALUE
          value: ","
        - name: GENERAL_NGSILDORQUERYKEY
          value: ","
        - name: GENERAL_ENCLOSEQUERY
          value: "false"
        # = BUG ============================================================== #
        # If this value is not explicitly set, it resolves to `null` (even     #
        # though the source code defaults it to "/"). This breaks callback     #
        # URLs used for subscriptions with `data-service-scorpio`, producing   #
        # malformed endpoints like:                                            #
        #                                                                      #
        #   `http://tm-forum-api-svc:8080null/callback`                        #
        #                                                                      #
        # Relevant code:                                                       #
        #                                                                      #
        # ```java                                                              #
        # // file: common/src/.../rest/AbstractSubscriptionApiController.java  #
        # private URI getCallbackURI() {                                       #
        #     return URI.create(                                               #
        #         generalProperties.getServerHost() // GENERAL_SERVER_HOST     #
        #       + generalProperties.getBasepath()   // GENERAL_BASEPATH (null) #
        #       + EventConstants.SUBSCRIPTION_CALLBACK_PATH // "/callback"     #
        #     );                                                               #
        # }                                                                    #
        # ```                                                                  #
        # ==================================================================== #
        - name: GENERAL_BASEPATH
          value: "/"

    registration:
      enabled: false # Note: disabled for now, maybe?
      # -- name to be used for the registration jobs
      name: tmf-api-registration
      annotations: *hookAnnotations
      image:
        repository: curlimages/curl
        tag: 8.20.0
      command: [ /bin/sh, -c, /bin/init.sh ]
      # -- configuration to register the dataplane at the credentials-config-service
      ccs:
        <<: *ccsSetup
        id: tmf-api

    # enable the api proxy
    apiProxy:
      enabled: false # Note: I think we don't need this, allInOne is enabled...

  ## configuration of rainbow to provide integration with the Dataspace Protocol
  rainbow:
    enabled: false

  ## configuration of the tm-forum-api - see https://github.com/FIWARE/helm-charts/tree/main/charts/contract-management for details
  contract-management:
    enabled: false
    fullnameOverride: "contract-management"

    notification:
      enabled: true
      host: contract-management

    ## Enables integration with the (local) ODRL-PAP. http.services.odrl needs to be configured towards the ODRL-PAP.
    enableOdrlPap: true
    ## Enables integration with the (local) Trusted Issuers List. http.services.trusted-issuers-list needs to be configured towards the Trusted Issuers List.
    enableTrustedIssuersList: true
    ## Enables integration with the TMForum API.
    enableTmForum: true
    ## Requires TMForum integration to be enabled and the http.service.rainbow properly configured
    enableRainbow: false
    ## Enable integration with a central marketplace. Requires OdrlPap and TrustedIssuersList integration to be enabled.
    enableCentralMarketplace: true

    additionalEnvVars:
      - name: LOGGER_LEVELS_ROOT
        # value: TRACE
        value: INFO

    # = Note ================================================================= #
    # Because the DID is only known after deploy we need to generate a new     #
    # `/application.yaml` after the DID generation and hook it to the pod.     #
    # ======================================================================== #
    did: __DID__

    deployment:
      initContainers:
        - name: render-config
          image: *alpineImage
          command: ["/bin/sh", "-euc"]
          args:
            - |
              sed "s/__DID__/${DID}/" /original/application.yaml \
                | tee /generated/application.yaml
          env:
            - *didEnv
          volumeMounts:
            - name: application-yaml
              mountPath: /original
            - name: generated-config
              mountPath: /generated
        # Note: Wait of KC & generate the JWT tokens
        - name: wait-for-keycloak
          image: curlimages/curl:8.6.0
          command: ["/bin/sh", "-euc"]
          args:
            - |
              echo "Waiting for Keycloak to become ready..."

              until curl -sf "$KC_HEALTH" > /dev/null; do
                echo "Keycloak not ready yet, retrying..."
                sleep 5
              done
              echo "Keycloak is ready."
          env:
            - name: KC_HEALTH
              value: *kcHealthUrl
        - name: get-credential
          image: *curlImage
          command: ["/bin/sh", "-c"]
          args:
            - /bin/get-credential.sh /credential-repo
          volumeMounts:
            - name: credentials-script
              mountPath: /bin/get-credential.sh
              subPath: get-credential.sh
            - name: credential-repo
              mountPath: /credential-repo

      additionalVolumes:
        - name: generated-config
          emptyDir: {}
        - name: signing-key
          secret:
            secretName: *didSecret
            items:
              - key: private-key.pem
                path: private-key.pem
        # Note: Used to generate JWT tokens
        - name: credentials-script
          configMap:
            name: credentials-script
            defaultMode: 0755
        - name: credential-repo
          emptyDir: {}

      additionalVolumeMounts:
        - name: generated-config
          mountPath: /application-custom.yaml
          subPath: application.yaml
        - name: signing-key
          mountPath: /cert
        - name: credential-repo
          mountPath: /credential-repo

    # TODO: check if this works
    # Note: no idea what this is but if it works don't touch it d(^u^d )
    ## configures the m2m authentication via oid4vp
    oid4vp:
      enabled: true
      ## Identity of the credentials holder
      holder:
        ## ID of the holder
        holderId: __DID__
        ## Type of the key to be used for signing verifiable presentations as the holder
        keyType: EC
        ## Path that the signing key can be read from
        keyPath: /cert/private-key.pem
        ## Algorithm to be used for signing the presentations. Needs to work with the key
        # signatureAlgorithm: ES256 # Note: not supported
        signatureAlgorithm: ECDH-ES
      ## folder containing the credentials to be read
      credentialsFolder: /credential-repo
      ## trust anchors to be used in addition to the system trust store
      trustAnchors: []

    ## Organization configuration
    organization:
      ## Provider-side configuration
      provider:
        ## Role of the organization acting as provider (e.g. seller)
        role: seller

    # Note: I don't know why is everywhere enabled by default... (._. )
    # -- configuration for proemtheus metrics
    prometheus:
      enabled: false

    til:
      # TODO: check if this is correct...
      credentialType: OperatorCredential
    services:
      trusted-issuers-list:
        url: *tilUrl
      product-order:
        url: *tmfUrl
      party:
        url: *tmfUrl
      product-catalog:
        url: *tmfUrl
      service-catalog:
        url: *tmfUrl
      tmforum-agreement-api:
        url: *tmfUrl
      quote:
        url: *tmfUrl
      odrl:
        url: *papUrl

