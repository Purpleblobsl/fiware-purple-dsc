dsc:
  enabled: true

  # -- configuration to be shared between the issuance components
  issuance:
    generatePasswords:
      enabled: true
      secretName: *issuanceSecret

  decentralizedIam:
    enabled: true
    fullnameOverride: "decentralizedIam"

    # -- configuration for the vc-authentication to be deployed as part of the connector, see https://github.com/FIWARE/vc-authentication/tree/master
    vcAuthentication:
      enabled: true
      fullnameOverride: "vcAuthentication"

      ## Installation of the postgres-operator - see https://github.com/zalando/postgres-operator
      postgres-operator:
        enabled: false
        fullnameOverride: "postgres-operator"

      # = BUG ================================================================ #
      # Helm performs deep-merging of map values across all value sources      #
      # (`values.yaml`, `-f` overrides, subcharts, and chart defaults).        #
      #                                                                        #
      # This means default keys from parent charts or dependencies may persist #
      # unless the entire object is explicitly overridden at the correct path. #
      # Helm does NOT support deletion of individual map keys.                 #
      #                                                                        #
      # As a result, some configuration maps (e.g. `users`, `databases`) may   #
      # contain inherited or unexpected keys if not fully overridden.          #
      # ====================================================================== #
      ## Usage of the postgres-operator - see https://github.com/zalando/postgres-operator
      managedPostgres:
        enabled: false

      # -- configuration for the trusted-issuers-list to be deployed as part of the connector, see https://github.com/FIWARE/helm-charts/tree/main/charts/trusted-issuers-list for all options
      trusted-issuers-list:
        enabled: true
        fullnameOverride: "trusted-issuers-list"

        # -- connection to the database
        database:
          persistence: true
          host: postgres
          port: 5432
          name: tildb
          username: til
          existingSecret:
            enabled: true
            name: til.postgres.credentials.postgresql.acid.zalan.do
            key: password

      # -- configuration for the vcverifier to be deployed as part of the connector, see https://github.com/FIWARE/helm-charts/tree/main/charts/vcverifier for all options
      vcverifier:
        enabled: true
        fullnameOverride: "verifier"

        ingress:
          enabled: true
          # Note: fiware components use `className`, not `ingressClassName`:
          # > https://github.com/FIWARE/helm-charts/blob/main/charts/common/templates/_ingress.tpl
          className: *ingressClass
          annotations: *ingressAnnotations
          hosts:
            - host: *verifierHost
              paths:
                - "/"
          tls:
            - secretName: vcverifier-tls
              hosts:
                - *verifierHost

        deployment:
          server:
            # = Note ========================================================= #
            # After some painful debugging, thanks to the immoral logging and  #
            # cheapskate documentation culture, we went deep in the sauce.     #
            # tracing the issue to the following code:                         #
            #                                                                  #
            # ```go                                                            #
            # // file: openapi/api_frontend.go                                 #
            # if !slices.Contains(cro.Aud, getFrontendVerifier().GetHost()) {  #
            #    c.AbortWithStatusJSON(http.StatusInternalServerError,         #
            #                          ErrorMessageInvalidAudience)            #
            #    return                                                        #
            # }                                                                #
            # ```                                                              #
            #                                                                  #
            # The issue appears to be a mismatch between the expected format   #
            # of the JWT audience (`cro.Aud`) and the value returned by        #
            # `getFrontendVerifier().GetHost()`.                               #
            #                                                                  #
            # Specifically, `cro.Aud` contains the full service URL from the   #
            # JWT (e.g. including scheme and host), while `GetHost()`          #
            # returns only the host component (or a partial identifier).       #
            #                                                                  #
            # As a result, the comparison fails even when both refer to the    #
            # same service, because the string formats differ. (._. )          #
            # ================================================================ #
            host: *verifierUrl

          # -- logging configuration
          logging:
            # -- the log level, can be DEBUG, INFO, WARN, ERROR
            # level: INFO
            level: DEBUG

          # TODO: maybe we need to extend this config...
          #       https://github.com/fiware/vcverifier#configuration
          # -- config repo configuration
          configRepo:
            configEndpoint: *ccsUrl

          # = Note ============================================================= #
          # Because the DID is only known after deploy we need to generate a new #
          # `/configs/server.yaml` after the DID generation and hook it to the   #
          # pod. To do that we use the default config file as our base and using #
          # a init container we override the file DID, save it into a empty      #
          # volume and mount it to the pod.                                      #
          # ==================================================================== #
          alternativeConfig: /alternative-conf/server.yaml

          additionalEnvVars:
            - &didEnv
              name: DID
              valueFrom:
                secretKeyRef:
                  name: *didSecret
                  key: DID

          # -- configuration required for the verifier functionality
          verifier:
            did: __DID__
            # = Note ========================================================= #
            # Special thanks to the worst terrorist this company has to offer: #
            # Mosi Pringles. He tried his best to resolve this issue but it    #
            # didn't budge.                                                    #
            #                                              signed: The Janitor #
            # ================================================================ #
            tirAddress: *tprUrl
            # -- expiry of a login-session in seconds
            sessionExpiry: 30
            # -- validation mode for validation the vcs (dont get confused, its just about validation, verfication happens anyways)
            # applicable modes:
            # * `none`: No validation, just swallow everything
            # * `combined`: ld and schema validation
            # * `jsonLd`: uses JSON-LD parser for validation
            # * `baseContext`: validates that only the fields and values (when applicable)are present in the document. No extra fields are allowed (outside of credentialSubject).
            # Default is set to `none` to ensure backwards compatibility
            validationMode: none


            # Note: I don't know why we do this
            # supportedModes: ["byValue", "byReference"]
            supportedModes: ["urlEncoded", "byValue", "byReference"]
            clientIdentification:
              id: *verifierId
              keyPath: /signing-key/private-key.pem
              requestKeyAlgorithm: ES256
              certificatePath: /certificate/cert.pem

          initContainers:
            - name: render-config
              image: *alpineImage
              command: ["/bin/sh", "-xeuc"]
              args:
                - |
                  sed "s/__DID__/${DID}/" \
                    /original-conf/server.yaml > /alternative-conf/server.yaml
              env:
                - *didEnv
              volumeMounts:
                - name: alternative-conf
                  mountPath: /alternative-conf
                - name: config-volume
                  mountPath: /original-conf/
            - name: register-at-tir
              image: *curlImage
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  curl -siL -X POST "${TIL_URL}/issuer" \
                    -H "Content-Type: application/json" \
                    -d '{"did":"'"${DID}"'","credentials":[]}'
              env:
                - *didEnv
                - name: TIL_URL
                  value: *tplUrl

          additionalVolumes:
            - name: alternative-conf
              emptyDir: {}
            - name: vcverifier-tls
              secret:
                secretName: vcverifier-tls

          additionalVolumeMounts:
            - name: alternative-conf
              mountPath: /alternative-conf
            # Note: I don't know why we do this
            # Note(del muerto de hambre de Jorge): Como el certificado expedido
            # por LetsEncrypt acabará caducando y habrá que reiniciar el pod a
            # mano para que el secreto se vuelva a montar. Probablmenete es
            # mejor no usar subPath y guardarlos en la misma ruta. Tanto el
            # certificado como la clave privada. Que no sé si el verifier las
            # lee cada vez del disco o las guarda en memoria.
            - name: vcverifier-tls
              mountPath: /certificate/cert.pem
              subPath: tls.crt
            - name: vcverifier-tls
              mountPath: /signing-key/private-key.pem
              subPath: tls.key

      # -- configuration for the credentials-config-service to be deployed as part of the connector, see https://github.com/FIWARE/helm-charts/tree/main/charts/credentials-config-service for all options
      credentials-config-service:
        enabled: true
        fullnameOverride: "credentials-config-service"

        # -- connection to the database
        database:
          persistence: true
          host: postgres
          port: 5432
          name: ccsdb
          dialect: POSTGRES
          username: ccs
          existingSecret:
            enabled: true
            name: ccs.postgres.credentials.postgresql.acid.zalan.do
            key: password

        # -- configuration to be included in the application.yaml file
        config: {}

        ## deployment specific configuration
        deployment:
          # -- resources assigned to the deployment pod
          resources: {}
          # resources:
            # limits:
              # cpu: 100m
              # memory: 128Mi
            # requests:
              # cpu: 100m
              # memory: 128Mi
        ## pod autoscaling configuration, use for automatic scaling of the broker pods
        autoscaling:
          enabled: false
          minReplicas: 1
          maxReplicas: 10
          # -- metrics to react on
          metrics: []
          ## List of MetricSpecs to decide whether to scale
          # See https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.17/#metricspec-v2beta2-autoscaling
          # scaler targets to hold average cpu around 80%
          #- type: Resource
          #  resource:
          #    name: cpu
          #     target:
          #      type: Utilization
          #      averageUtilization: 80
          ## scaler targets to hold average memory around 80%
          #  - type: Resource
          #    resource:
          #      name: memory
          #      target:
          #        type: Utilization
          #        averageUtilization: 80

        ## openshift specific route definition. Will not work on plain k8s
        route:
          enabled: false

        ## ingress configuration
        ingress:
          enabled: false # Note: for tests it can help to have this public
          className: *ingressClass
          annotations:
            <<: *ingressAnnotations
            ingress.kubernetes.io/ssl-redirect: "true"
          hosts:
            - host: *ccsHost
              paths: ["/"]
          tls:
            - secretName: ccs-tls
              hosts:
                - *ccsHost

        # -- port that the til container uses
        port: 8080

        ## configuration for prometheus montioring
        prometheus:
          enabled: false

        # -- a list of additional env vars to be set, check the til docu for all available options
        additionalEnvVars:
          - *didEnv
          - name: FLYWAY_DATASOURCES_DEFAULT_LOCATIONS
            value: classpath:db/migration/common,classpath:db/migration/mysql

        ## configure automatic registration of credentials and services on deploy
        registration:
          enabled: true
          job:
            initContainers:
              waitForHost:
                enabled: true
                path: /health
            activeDeadlineSeconds: null
          backoffLimit: 10
          # -- optional prepariation script
          # Note: We do the scary curl because we can't mount the DID env...
          prepScript: >
            sleep 1;
            export $(curl -sL http://did-helper:3000/did-material/did.env)

          # -- configuration of the services (and scopes) to be registred
          services: # TODO: read more about this...
            - id: tpp-service
              defaultOidcScope: "operator"
              authorizationType: "DEEPLINK"
              oidcScopes:
                "operator":
                  credentials:
                    - &oidcScopesCredential
                      type: OperatorCredential
                      trustedParticipantsLists:
                        - *tprUrl
                      trustedIssuersLists:
                        - *tilUrl
                      jwtInclusion:
                        enabled: true
                        fullInclusion: true
            - id: bae
              defaultOidcScope: "openid learcredential"
              authorizationType: "FRONTEND_V2"
              oidcScopes:
                "openid learcredential":
                  credentials:
                    - <<: *oidcScopesCredential
                      type: LegalPersonCredential
                  presentationDefinition: &legalPersonPD
                    id: legal-person-pd
                    input_descriptors:
                      - id: legal-person-query
                        constraints:
                          fields:
                            - id: vct
                              path: ["$.vct"]
                              filter:
                                const: "LegalPersonCredential"
                            - id: subject
                              path: ["$.firstName"]
                            - id: roles
                              path: ["$.roles"]
                        format:
                          "vc+sd-jwt":
                            alg: ["ES256"]
                    format:
                      "vc+sd-jwt":
                        alg: ["ES256"]
                  # = Note =================================================== #
                  # The wallets we are using don't support Digital Credentials #
                  # Query Language (`dcql`) defined by *OpenID4VP 1.0*.        #
                  #                                                            #
                  # Wallet logs:                                               #
                  # ... : OpenId4VPAuthorization received                      #
                  # ... : Currently only PresentationDefinition is supported   #
                  # ========================================================== #
                  # dcql:
                  #   credentials:
                  #     - &legalPersonDCQL
                  #       id: legal-person-query
                  #       format: "vc+sd-jwt"
                  #       multiple: false
                  #       claims:
                  #         - id: name-claim
                  #           path:
                  #             - firstName
                  #         - id: roles-claim
                  #           path:
                  #             - roles
                  #       meta:
                  #         vct_values:
                  #           - LegalPersonCredential
            - id: data-service
              defaultOidcScope: "default"
              authorizationType: "DEEPLINK"
              oidcScopes:
                "default":
                  credentials:
                    - <<: *oidcScopesCredential
                      type: UserCredential
                  presentationDefinition: &userPD
                    id: user-pd
                    input_descriptors:
                      - id: user-query
                        constraints:
                          fields:
                            - id: type
                              path: ["$.type"]
                              filter:
                                type: array
                                contains:
                                  const: "UserCredential"
                        format:
                          jwt_vc_json:
                            alg: ["ES256"]
                    format:
                      jwt_vc_json:
                        alg: ["ES256"]
                  # dcql:
                  #   credentials:
                  #     - &userDCQL
                  #       id: user-query
                  #       format: "jwt_vc_json"
                  #       multiple: true
                  #       meta:
                  #         type_values:
                  #           - [UserCredential]
                "legal":
                  credentials:
                    - <<: *oidcScopesCredential
                      type: LegalPersonCredential
                  presentationDefinition: *legalPersonPD
                  # dcql:
                  #   credentials:
                  #     - *legalPersonDCQL
                "operator":
                  credentials:
                    - <<: *oidcScopesCredential
                      type: OperatorCredential
                  # = Note =================================================== #
                  # This `presentationDefinition` has not been tested. If auth #
                  # issues occur, this might be a contributing factor. This    #
                  # `yaml` is straight from *Gepeto the Eternal Wordsmith*.    #
                  #                                          sign: The Janitor #
                  # ========================================================== #
                  presentationDefinition: &operatorPD
                    id: operator-pd
                    input_descriptors:
                      - id: operator-query
                        constraints:
                          fields:
                            - id: type
                              path: ["$.type"]
                              filter:
                                type: array
                                contains:
                                  const: "OperatorCredential"
                        format:
                          jwt_vc_json:
                            alg: ["ES256"]
                  # dcql:
                  #   credentials:
                  #     - &operatorDCQL
                  #       id: operator-query
                  #       format: "jwt_vc_json"
                  #       multiple: true
                  #       meta:
                  #         type_values:
                  #           - [OperatorCredential]
            - id: dsp
              defaultOidcScope: "openid"
              authorizationType: "DEEPLINK"
              oidcScopes:
                "openid":
                  credentials:
                    - <<: *oidcScopesCredential
                      type: MembershipCredential
                      trustedIssuersLists: ["*"]
                  presentationDefinition: &membershipPD
                    id: membership-pd
                    input_descriptors:
                      - id: membership-query
                        constraints:
                          fields:
                            - id: type
                              path: ["$.type"]
                              filter:
                                type: array
                                contains:
                                  const: "MembershipCredential"
                        format:
                          jwt_vc_json:
                            alg: ["ES256"]
                  # dcql:
                  #   credentials:
                  #     - &membershipDCQL
                  #       id: mc-query
                  #       format: "jwt_vc_json"
                  #       multiple: true
                  #       meta:
                  #         type_values:
                  #           - [MembershipCredential]
            # Note =========================================================== #
            # We rolled these ourselves because, FIWARE be lacking...          #
            #                                                                  #
            # They seem to work. Don't touch them too much. I don't know if we #
            # messed up the values or if they forgor.                          #
            # ================================================================ #
            - id: "${DID}"
              defaultOidcScope: "openid learcredential"
              authorizationType: "FRONTEND_V2"
              oidcScopes:
                "openid learcredential":
                  credentials:
                    - <<: *oidcScopesCredential
                      type: LegalPersonCredential
                  presentationDefinition: *legalPersonPD
                  # dcql:
                  #   credentials:
                  #     - *legalPersonDCQL
            - id: tmf-api
              defaultOidcScope: "default"
              authorizationType: "DEEPLINK"
              oidcScopes:
                "default":
                  credentials:
                    - <<: *oidcScopesCredential
                      type: UserCredential
                  presentationDefinition: *userPD
                  # dcql:
                  #   credentials:
                  #     - *userDCQL
                "legal":
                  credentials:
                    - <<: *oidcScopesCredential
                      type: LegalPersonCredential
                  presentationDefinition: *legalPersonPD
                  # dcql:
                  #   credentials:
                  #     - *legalPersonDCQL
                "operator":
                  credentials:
                    - <<: *oidcScopesCredential
                      type: OperatorCredential
                  presentationDefinition: *operatorPD
                  # dcql:
                  #   credentials:
                  #     - *operatorDCQL
            - id: cm-patch
              defaultOidcScope: "external-marketplace"
              authorizationType: "DEEPLINK"
              oidcScopes:
                "external-marketplace":
                  credentials:
                    - <<: *oidcScopesCredential
                      type: MarketplaceCredential
                      trustedIssuersLists: ["*"]
                  presentationDefinition: &marketplacePD
                    id: marketplace-pd
                    input_descriptors:
                      - id: marketplace-query
                        constraints:
                          fields:
                            - id: type
                              path: ["$.type"]
                              filter:
                                type: array
                                contains:
                                  const: "MarketplaceCredential"
                        format:
                          jwt_vc_json:
                            alg: ["ES256"]
                  # dcql:
                  #   credentials:
                  #     - &marketplaceDCQL
                  #       id: mc-query
                  #       format: "jwt_vc_json"
                  #       multiple: true
                  #       meta:
                  #         type_values:
                  #           - [MarketplaceCredential]

      # -- configuration for the digital-signature.service to be deployed as part of the connector in case of did:elsi support
      dss:
        enabled: false

    # configuration for the odrl-authorization to be deployed as part of the connector, see https://github.com/FIWARE/odrl-authorization/tree/master
    odrlAuthorization:
      enabled: true
      fullnameOverride: "odrlAuthorization"

      # -- configuration for the odrl-pap to be deployed as part of the connector, see https://apisix.apache.org/
      apisix:
        enabled: true
        fullnameOverride: "apisix"

        apisix:
          # admin:
          #   credentials:
          #     admin: *apisixPass
          #   allow:
          #     ipList:
          #       - 0.0.0.0/0
          etcd:
            replicaCount: 1
            persistence:
              enabled: false
          deployment:
            mode: traditional
            role: "traditional"
            role_traditional:
              config_provider: "etcd"
            role_data_plane:
              config_provider: "etcd"
          # Note: I don't know why this is disabled :)
          catchAllRoute:
            enabled: false

        # Note: I don't know why this is disabled :)
        catchAllRoute:
          enabled: false

        ingress-controller:
          enabled: false

        control:
          enabled: true
          service:
            type: ClusterIP

        ingress:
          enabled: true
          className: *ingressClass
          annotations: *ingressAnnotations
          hosts:
            # - host: apisix.local
            #   paths: ["/*"]
            - host: *mpDataServiceHost
              paths: ["/"]
            - host: *mpTmfApiHost
              paths: ["/"]
            - host: *cmpHost
              paths: ["/"]
          tls:
            - secretName: apisix-tls
              hosts:
                - *mpDataServiceHost
                - *mpTmfApiHost
                - *cmpHost

        routes:
          - uri: /.well-known/openid-configuration
            host: *mpDataServiceHost
            upstream: &verifierUpstream
              nodes:
                verifier:3000: 1
              type: roundrobin
            plugins:
              proxy-rewrite:
                uri: /services/tpp-service/.well-known/openid-configuration
          - uri: /.well-known/openid-configuration
            host: *mpDataServiceHost
            upstream: *verifierUpstream
            plugins:
              proxy-rewrite:
                uri: /services/data-service/.well-known/openid-configuration
          - uri: /.well-known/openid-configuration
            host: *cmpHost
            upstream: *verifierUpstream
            plugins:
              proxy-rewrite:
                uri: /services/cm-patch/.well-known/openid-configuration
          - uri: /*
            host: *cmpHost
            priority: 100
            vars:
              - ["uri", "~~", "/\\.well-known/openid-configuration$"]
            upstream: *verifierUpstream
            plugins:
              proxy-rewrite:
                uri: /services/cm-patch/.well-known/openid-configuration
          - uri: /.well-known/data-space-configuration
            # Note: I think this is meant to work with any host under apisix
            # host:
            upstream: &dsconfigUpstream
              nodes:
                dsconfig:3002: 1
              type: roundrobin
            plugins:
              proxy-rewrite:
                uri: /.well-known/data-space-configuration/data-space-configuration.json
              response-rewrite:
                headers:
                  set:
                    content-type: application/json
          - uri: /*
            host: *mpDataServiceHost
            upstream: &scorpioUpstream
              nodes:
                data-service-scorpio:9090: 1
              type: roundrobin
            plugins:
              openid-connect:
                bearer_only: true
                use_jwks: true
                client_id: data-service
                client_secret: unused
                ssl_verify: false
                # Note: I think we could do this internally...
                discovery: *mpDataServiceWellUrl
              opa:
                host: "http://localhost:8181"
                policy: policy/main
                with_body: true
          - uri: /.well-known/openid-configuration
            host: *mpTmfApiHost
            upstream: *verifierUpstream
            plugins:
              proxy-rewrite:
                uri: /services/tmf-api/.well-known/openid-configuration
          - uri: /*
            host: *mpTmfApiHost
            upstream: &tmfUpstream
              nodes:
                tm-forum-api-svc:8080: 1
              type: roundrobin
            plugins:
              openid-connect:
                bearer_only: true
                use_jwks: true
                client_id: cm-patch
                client_secret: unused
                ssl_verify: false
                discovery: *tmfWellUrl
              opa:
                host: "http://localhost:8181"
                policy: policy/main
                with_body: true
          - uri: /*
            host: *cmpHost
            upstream: &cmpUpstream
              nodes:
                cm-patch:8080: 1
              type: roundrobin
            plugins:
              openid-connect:
                bearer_only: true
                use_jwks: true
                client_id: cm-patch
                client_secret: unused
                ssl_verify: false
                discovery: *cmpWellUrl
              opa:
                host: http://localhost:8181
                policy: policy/main
                with_body: true

      # -- configuration for the odrl-pap to be deployed as part of the connector, see https://github.com/FIWARE/helm-charts/tree/main/charts/odrl-pap for all options
      odrl-pap:
        enabled: true
        fullnameOverride: "odrl-pap"

        additionalEnvVars:
          - <<: *didEnv
            name: GENERAL_ORGANIZATION_DID
          # Note: Don't know it's going to works, already spent +1h searching
          #       for ways to configure logging levels... `q(-_- )`
          - name: LOGGER_LEVELS_ROOT
            # value: TRACE
            value: INFO

        ## deployment specific configuration
        deployment: {}
          # resources:
          #   limits:
          #     cpu: 100m
          #     memory: 128Mi
          #   requests:
          #     cpu: 100m
          #     memory: 128Mi

        # -- connection to the database
        database:
          # Note: this is a JDBC connection string.
          #       https://en.wikipedia.org/wiki/Java_Database_Connectivity
          url: jdbc:postgresql://postgres:5432/papdb
          username: pap
          existingSecret:
            enabled: true
            name: pap.postgres.credentials.postgresql.acid.zalan.do
            key: password

        ingress:
          enabled: false
          className: *ingressClass
          annotations: *ingressAnnotations
          hosts:
            - host: *papHost
              paths: ["/"]
          tls:
            - secretName: odrl-pap-tls
              hosts:
                - *papHost

        ## configuration intended for the management endpoints, e.g. health and monitoring
        management:
          prometheus:
            enabled: false

        ## configuration to provide additional mappings from odrl to rego
        additionalMapping:
          enabled: false
          # -- mapping.json to merged with the defaults
          # the example would overwrite the default odrl:use to be handled by a custom rego method provided with the additional rego
          # json: |
          #   {
          #     "action": {
          #       "odrl": {
          #         "use" : {
          #           "regoPackage": "custom.action as custom_action",
          #           "regoMethod": "custom_action.is_use(helper.http_part)"
          #         }
          #       }
          #     }
          #   }

        ## configuration to provide additonal rego packages
        additionalRego:
          enabled: false
          # packages: |
          #   action.rego: |
          #     package odrl.action
          #
          #     import rego.v1
          #
          #     ## odrl:use
          #     # checks if the given request is a usage - in constrast to the default, this example would only consider modifications a "use"
          #     is_use(request) if {
          #         methods := ["POST", "PUT", "PATCH"]
          #         request.method in methods
          #     }

      # -- configuration for the open-policy-agent to be deployed as part of the connector fulfilling the role of the PDP, as a sidecar to apisix
      opa:
        enabled: true # default

      # -- integration of checks for the transfer process protocol
      tpp:
        enabled: false  # Note: I think this is for rainbow stuff... ( ._.)p

  ## configuration of the context-broker - see https://github.com/FIWARE/helm-charts/tree/main/charts/scorpio-broker-aaio for details
  scorpio:
    enabled: true
    fullnameOverride: "data-service-scorpio"

    image:
      repository: scorpiobroker/all-in-one-runner
      tag: java-4.1.10
    service:
      type: ClusterIP
      port: 9090

    ## configuration of the database to be used by broker
    db:
      dbhost: postgres
      user: scorpio
      existingSecret:
        enabled: true
        name: scorpio.postgres.credentials.postgresql.acid.zalan.do
        key: password

    readinessProbe:
      path: /q/health
    livenessProbe:
      path: /q/health

    # TODO: not sure this is right
    # -- configuration to register the dataplane at the credentials-config-service
    ccs: &ccsSetup
      enabled: true
      id: scorpio
      endpoint: *ccsUrl
      configMap: &scorpioConfigMap scorpio-registration
      defaultOidcScope:
        name: default
        credentialTypes:
          - LegalPersonCredential
        trustedParticipantsLists: *tprUrl
        trustedIssuersLists: *tilUrl

    # -- additional init containers to be used for the dataplane
    initContainers:
      - name: register-credential-config
        image: *curlImage
        command: [ "/bin/sh", "-c", "/bin/init.sh" ]
        volumeMounts:
          - name: *scorpioConfigMap
            mountPath: /bin/init.sh
            subPath: init.sh
    # -- additonal volumes to be mounted for the dataplane
    additionalVolumes:
      - name: *scorpioConfigMap
        configMap:
          name: *scorpioConfigMap
          defaultMode: 0755

    # resources:
    #   limits:
    #     cpu: 100m
    #     memory: 128Mi
    #   requests:
    #     cpu: 100m
    #     memory: 128Mi

  # -- configuration to issue credentials, using a did:elsi
  elsi:
    enabled: false # Note: We don't use blockchain stuff

  ## configuration of the keycloak - see https://github.com/bitnami/charts/tree/main/bitnami/keycloak for details
  keycloak:
    enabled: true
    fullnameOverride: "keycloak"

    kubeVersion: *kubeVersion

    global:
      security:
        allowInsecureImages: true
    image:
      repository: bitnamilegacy/keycloak

    # -- disable the security context, required by the current quarkus container, will be solved in the future chart versions of keycloak
    containerSecurityContext:
      enabled: false

    httpEnabled: true         # KC_HTTP_ENABLED
    proxyHeaders: xforwarded  # KC_PROXY_HEADERS

    ingress:
      enabled: true
      hostname: *kcHost
      ingressClassName: *ingressClass
      annotations: *ingressAnnotations
      tls: true

    metrics: # Note: enable this to have port 9000 abaible
      enabled: true

    containerPorts:
      http: 8080
      https: 8443
      management: 9000
    extraPorts:
      - name: discovery
        containerPort: 7200

    tls:
      enabled: false
    service:
      type: ClusterIP
      ports:
        http: 8080
        https: 8443
        management: 9000
      extraPorts:
        - name: discovery
          port: 7200
          targetPort: 7200

    # -- authentication config for keycloak
    auth:
      adminUser: keycloak-admin
      passwordSecretKey: keycloak-admin
      existingSecret: *issuanceSecret

    # -- sets memory requests for keycloak
    # increased above the bitnami defaults to prevent OOMs in linux kernel >=6.14
    resources:
      requests:
        memory: "500Mi"
        cpu: "0.5"
      limits:
        memory: "2Gi"
        cpu: "1"

    # -- increase thresholds to prevent crashloops in low resource deployments
    livenessProbe:
      failureThreshold: 20
    readinessProbe:
      failureThreshold: 20

    # -- should the db be deployed as part of the keycloak chart
    postgresql:
      enabled: false
    # -- host of the external db to be used
    externalDatabase:
      host: postgres
      database: keycloakdb
      user: keycloak
      existingSecret: keycloak.postgres.credentials.postgresql.acid.zalan.do
      existingSecretPasswordKey: password

    # -- extra volumes to be mounted
    extraVolumeMounts:
      - name: realms
        mountPath: /opt/bitnami/keycloak/data/import
      - name: did-material
        mountPath: /did-material
    extraVolumes:
      - name: realms
        configMap:
          name: test-realm-realm
      - name: did-material
        secret:
          secretName: *didSecret

    # Note: for more options go to: https://www.keycloak.org/server/all-config
    # -- extra env vars to be set. we require them at the moment, since some of the chart config mechanisms only work with the bitnami-image
    extraEnvVars:
      - name: KEYCLOAK_EXTRA_ARGS
        value: "--import-realm --health-enabled true"
      - name: KC_FEATURES
        value: "oid4vc-vci"
      # set in accordance with the memory requests, will result in OOM otherwise
      - name: KC_HEAP_SIZE
        value: "1024m"
      - *didEnv
      - name: KC_ADMIN_PASSWORD
        valueFrom:
          secretKeyRef:
            name: issuance-secret
            key: keycloak-admin
      - name: "STORE_PASS"
        valueFrom:
          secretKeyRef:
            name: *ksSecret
            key: *ksSecretKey

    issuerDid: "${DID}"
    signingKey:
      storePath: /did-material/cert.pfx
      storePassword: "${STORE_PASS}"
      keyAlias: didPrivateKey
      keyPassword: "${STORE_PASS}"
      did: "${DID}"
      keyAlgorithm: ES256

    # -- configuration of the realm to be imported
    realm:
      import: true
      name: *kcRealm
      frontendUrl: *kcUrl
      sslRequired: none
      # -- realm attributes. Support string (old style) or key-value
      attributes:
        issuerDid: "${DID}"
        vc.user-sd.credential_signing_alg_values_supported: ES256
        vc.user-sd.credential_build_config.signing_algorithm: ES256
        vc.user-sd.credential_build_config.token_jws_type: vc+sd-jwt
        vc.user-sd.credential_build_config.proof_types_supported: '{"jwt":{"proof_signing_alg_values_supported":["ES256"]}}'
        vc.user-sd.format: vc+sd-jwt
        vc.user-sd.scope: LegalPersonCredential
        vc.user-sd.vct: LegalPersonCredential
        vc.user-sd.credential_build_config.visible_claims: 'roles,email'
        vc.user-sd.credential_build_config.decoys: '0'
        vc.user-credential.credential_signing_alg_values_supported: ES256
        vc.user-credential.credential_build_config.signing_algorithm: ES256
        vc.user-credential.credential_build_config.token_jws_type: JWT
        vc.user-credential.credential_build_config.proof_types_supported: '{"jwt":{"proof_signing_alg_values_supported":["ES256"]}}'
        vc.user-credential.format: jwt_vc
        vc.user-credential.scope: UserCredential
        vc.user-credential.vct: UserCredential
        vc.legal-person-credential.credential_signing_alg_values_supported: ES256
        vc.legal-person-credential.credential_build_config.signing_algorithm: ES256
        vc.legal-person-credential.credential_build_config.token_jws_type: JWT
        vc.legal-person-credential.credential_build_config.proof_types_supported: '{"jwt":{"proof_signing_alg_values_supported":["ES256"]}}'
        vc.legal-person-credential.format: jwt_vc
        vc.legal-person-credential.scope: LegalPersonCredential
        vc.legal-person-credential.vct: LegalPersonCredential
        vc.membership-credential.credential_signing_alg_values_supported: ES256
        vc.membership-credential.credential_build_config.signing_algorithm: ES256
